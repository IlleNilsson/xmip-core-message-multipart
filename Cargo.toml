[package]
name = "xmip-core-message-multipart"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-message-multipart"
description = "Multipart shape: a body split on its boundary into named parts each with its own media type, the type parameter of multipart/related as the announced type. A xmip-core-message technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The parent capability's `Shape` (`message::shape`; repository-model.md),
# and the Stream it shapes.
message = { workspace = true }
stream = { workspace = true }
# A media type's parameters, and the multipart body, as MIME reads them.
codec = { workspace = true }

[dev-dependencies]
xcore = { workspace = true }

[lints]
workspace = true
